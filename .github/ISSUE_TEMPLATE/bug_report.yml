name: Bug report
description: Report a reproducible problem with dsh-deepseek-vision
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For vulnerabilities, use the private process in [SECURITY.md](https://github.com/Argonaut790/dsh-deepseek-vision/blob/main/SECURITY.md) instead.

  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node.js, DSH, operating system, and selected vision provider versions where relevant.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible example and exact steps.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, credentials, personal data, and sensitive image content.

  - type: textarea
    id: context
    attributes:
      label: Additional context

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
